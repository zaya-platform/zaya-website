# ZAYA Digital Front Door — Netlify deploy config.
# Static Astro build; no backend. Admin content editing via Sveltia CMS (/admin).

[build]
  # Default (branch / deploy-preview builds): noindex DRAFT — lets you and admin
  # staff test the live build + CMS before go-live, without bypassing anything public.
  command = "npm run build:draft"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ⚑ RESTORED 2026-08-20 (founder ruling). Production runs the REAL GATED BUILD.
#
# What was wrong: from 2026-07-08 this context ran `npm run build:draft`, which skips
# scripts/check-publish.mjs entirely. The gate is the only thing standing between a
# flipped flag and a live, indexed, AI-answering site — and production was the ONE
# context configured to walk around it. A draft build at published=true would have
# emitted ZERO noindex tags with no check having run at all.
#
# ⚠ THE CONSEQUENCE, STATED PLAINLY: `npm run build` FAILS (exit 1) while
# site.json published=false. So the PRODUCTION deploy of this site will now fail
# until publish is genuinely cleared. That is the gate doing its job, not a bug.
# Netlify keeps serving the LAST SUCCESSFUL production deploy, so the parked site
# stays up and frozen rather than going dark. For the pre-domain "shareable but
# hidden" phase, use a BRANCH DEPLOY instead: the [build] command above is still
# `npm run build:draft`, so every branch/preview deploy builds noindex without the
# gate, exactly as before. See GO-LIVE.md Step 4 and docs/ASSISTANT-GATE.md.
[context.production]
  command = "npm run build"

# ── The founder's assistant preview (W-D4a) ─────────────────────────────────
# The AI assistant ships OFF everywhere by default (src/config/assistant.json
# enabled:false). This ONE branch context asks for it. It still needs a usable
# ZAYA_ASSISTANT_TOKEN in the Netlify environment — without one the build emits
# no widget at all (fail-closed) and the relay answers 503 to everybody.
# The token is a SECRET and therefore is NOT in this file: set it in
# Netlify → Site configuration → Environment variables, scoped to branch deploys.
# Full phone-followable instructions: docs/ASSISTANT-GATE.md §"For the founder".
[context."preview/assistant".environment]
  ZAYA_ASSISTANT = "on"

# Belt and braces: production NEVER gets the assistant from an env slip. Even if
# someone sets ZAYA_ASSISTANT=on in the Netlify UI for all contexts, this pins the
# production build to off (the kill switch beats everything — see
# src/config/assistant.mjs precedence rules).
[context.production.environment]
  ZAYA_ASSISTANT = "off"

# The CMS admin UI must never be indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Long-cache the hashed, immutable build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# GitHub OAuth relay for the CMS admin login (Sveltia/Decap-compatible), hosted as
# Netlify Functions on this same site — no Cloudflare, no deprecated Netlify Identity.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200

# Website AI Assistant relay (CR-027/ADR-024, FDR-019 W-D4a — founder-access
# preview). GEMINI_API_KEY lives ONLY in Netlify env; the curated FAQ/KB/rules
# cascade works fully without it (only the English model-fallback is dark).
[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200

# Ethiopian flagship domains → 301 to the primary (zayaethiopia.com), so ZAYA keeps
# ONE canonical site while owning the local .et brand. Register zaya.et and/or
# zaya.com.et, add them as secondary domains on this Netlify site (keep
# zayaethiopia.com as PRIMARY), and every path forwards to the primary.
# NOTE: .et registration goes via Ethio Telecom / the .et NIC and must allow pointing
# DNS at Netlify — confirm that before relying on it (see docs/13).
[[redirects]]
  from = "https://zaya.et/*"
  to = "https://zayaethiopia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.zaya.et/*"
  to = "https://zayaethiopia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://zaya.com.et/*"
  to = "https://zayaethiopia.com/:splat"
  status = 301
  force = true
