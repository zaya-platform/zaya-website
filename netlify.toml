# ZAYA Digital Front Door — Netlify deploy config.
# Static Astro build; no backend. Admin content editing via Sveltia CMS (/admin).

[build]
  # Default (branch / deploy-preview builds): noindex DRAFT — lets you and admin
  # staff test the live build + CMS before go-live, without bypassing anything public.
  command = "npm run build:draft"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ⚑ TEMPORARY (pre-domain phase, 2026-07-08; re-affirmed 2026-08-20): main deploys
# the NOINDEX DRAFT build so the site can go live on the free *.netlify.app address
# — accessible/shareable but HIDDEN from Google — without needing published=true and
# without the gate failing. The site cannot be indexed while published=false
# (noindex meta + robots Disallow, both generated from that one flag).
# THIS IS THE FOUNDER'S LIVE PREVIEW URL. It must keep deploying.
#
# ⚑ 2026-08-20 — WHY THIS IS STILL build:draft, AND WHAT CHANGED UNDER IT.
# feat/assistant-gate switched this line to `npm run build` to close a real hole:
# a draft build at published=true would emit an INDEXABLE site with no gate having
# run. The hole was real; that fix was the wrong end of it. `npm run build` exits 1
# while published=false, so it would have failed EVERY production deploy — the
# founder's preview would freeze on its last successful build and silently stop
# reflecting main. Trading a live preview for a gate that only fires when the flag
# is already wrong is a bad trade, and it breaks the one thing this URL is for.
#
# The hole is now closed at the other end instead: `build:draft` runs
# scripts/check-draft.mjs, which REFUSES to build when published=true. The pair is
# exhaustive over the flag —
#   published=false -> only build:draft succeeds -> output is noindex + Disallow
#   published=true  -> only build succeeds       -> full publish gate has run
# so NO BUILD PATH CAN PRODUCE AN INDEXABLE SITE WITHOUT THE FULL GATE PASSING,
# and the parked site keeps deploying on every push to main.
#
# The assistant gate rides this build too, and needs no change here: the assistant
# is OFF by default in src/config/assistant.json, the draft build emits no widget
# markup at all, and [context.production.environment] below pins ZAYA_ASSISTANT=off
# regardless. What check-publish.mjs adds — asserting the assistant's state — only
# matters on a publish build, which is exactly where it still runs.
#
# ⚑ RESTORE AT GO-LIVE (once zayaethiopia.com is registered + connected in Netlify):
# switch this to `npm run build` AND set site.json published=true, in the same
# change. Doing either alone now fails the build by design — that is the pair
# working. See GO-LIVE.md Step 4 and docs/ASSISTANT-GATE.md.
[context.production]
  command = "npm run build:draft"
  # command = "npm run build"   # ← RESTORE at go-live, together with published=true

# ── The founder's assistant preview (W-D4a) ─────────────────────────────────
# The AI assistant ships OFF everywhere by default (src/config/assistant.json
# enabled:false). This ONE branch context asks for it. It still needs a usable
# ZAYA_ASSISTANT_TOKEN in the Netlify environment — without one the build emits
# no widget at all (fail-closed) and the relay answers 503 to everybody.
# The token is a SECRET and therefore is NOT in this file: set it in
# Netlify → Site configuration → Environment variables, scoped to branch deploys.
# Full phone-followable instructions: docs/ASSISTANT-GATE.md §"For the founder".
[context."preview/assistant".environment]
  ZAYA_ASSISTANT = "on"

# Belt and braces: production NEVER gets the assistant from an env slip. Even if
# someone sets ZAYA_ASSISTANT=on in the Netlify UI for all contexts, this pins the
# production build to off (the kill switch beats everything — see
# src/config/assistant.mjs precedence rules).
[context.production.environment]
  ZAYA_ASSISTANT = "off"

# The CMS admin UI must never be indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Long-cache the hashed, immutable build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# GitHub OAuth relay for the CMS admin login (Sveltia/Decap-compatible), hosted as
# Netlify Functions on this same site — no Cloudflare, no deprecated Netlify Identity.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/callback"
  to = "/.netlify/functions/callback"
  status = 200

# Website AI Assistant relay (CR-027/ADR-024, FDR-019 W-D4a — founder-access
# preview). GEMINI_API_KEY lives ONLY in Netlify env; the curated FAQ/KB/rules
# cascade works fully without it (only the English model-fallback is dark).
[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200

# Ethiopian flagship domains → 301 to the primary (zayaethiopia.com), so ZAYA keeps
# ONE canonical site while owning the local .et brand. Register zaya.et and/or
# zaya.com.et, add them as secondary domains on this Netlify site (keep
# zayaethiopia.com as PRIMARY), and every path forwards to the primary.
# NOTE: .et registration goes via Ethio Telecom / the .et NIC and must allow pointing
# DNS at Netlify — confirm that before relying on it (see docs/13).
[[redirects]]
  from = "https://zaya.et/*"
  to = "https://zayaethiopia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.zaya.et/*"
  to = "https://zayaethiopia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://zaya.com.et/*"
  to = "https://zayaethiopia.com/:splat"
  status = 301
  force = true
